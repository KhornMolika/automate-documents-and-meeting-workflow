<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUB Meeting Assistant — Microphone</title>
    <style>
      :root {
        --brand: #7a1f35;
        --ink: #231f1c;
        --muted: #6f6a62;
        --border: #e5e1d8;
        --stone: #f4f3f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--stone);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: min(520px, calc(100% - 32px));
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; }
      p { margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: var(--muted); }
      button {
        height: 40px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        padding: 0 18px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 16px; font-size: 14px; color: var(--brand); }
      .hint { margin: 18px 0 0; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Enable the microphone</h1>
      <p>
        The AUB Meeting Assistant captures your microphone separately from the Google Meet tab.
        Chrome needs your permission before your own voice can be transcribed.
      </p>
      <button id="allow">Allow microphone</button>
      <p id="status" role="status"></p>
      <p class="hint">
        After allowing, close this tab and click <strong>Start capture</strong> again in the extension popup.
      </p>
    </main>
    <script src="mic.js"></script>
  </body>
</html>
