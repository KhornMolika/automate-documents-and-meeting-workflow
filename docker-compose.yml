version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aub_workflow_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aub_workflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: aub_workflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  speech-service:
    build:
      context: ./speech-service
      dockerfile: Dockerfile.gpu
    container_name: aub_workflow_speech
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./speech-service:/app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aub_workflow_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aub_workflow}
      REDIS_URL: redis://redis:6379/0
      SPEECH_SERVICE_URL: http://speech-service:8001
      JWT_SECRET: ${JWT_SECRET:-secret_dev_key_acleda_workflow_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:
